  <header class="header">
    <!-- w - 1024  h - 682-->
    <img width="300" height="200" src="/public/images/logo.png" alt="ONG logo. Instituto Vida Verde. Cuidar da natureza é cuidar de todos nós.">
    <nav class="nav-bar">
      <hr >
      <a href="/">Inicio</a>
      <hr>
      <a href="./projetos.html">Conheça nossos projetos</a>
      <hr>
      <span>Seja um voluntário</span>
      <hr>
    </nav>
  </header>
  <main class="main-container">
    <form>
      <label for="name">Nome completo: <input id="name" type="text"></label>
      <label for="e-mail">Email: <input id="e-mail" type="email"></label>
      <label for="cpf">CPF: <input id="cpf" type="text" pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}"></label>
      <label for="phone">Telefone: <input id="phone" type="tel" pattern="([0-9]){2} [0-9]{5}-[0-9]{4}"></label>
      <label for="birth-date">Data de Nascimento: <input id="birth-date" type="date"></label>
      <label for="address">Endereço: <input id="address" type="text"></label>
      <label for="cep">CEP: <input id="cep" type="text" pattern="[0-9]{5}-[0-9]{3}"></label>
      <label for="city">Cidade: <input id="city" type="text"></label>
      <label for="state">Estado: <input id="state" type="text"></label>
    </form>
  </main>
  <footer class="footer">
    <img width="150" height="100" src="/public/images/logo.png" alt="ONG logo. Instituto Vida Verde. Cuidar da natureza é cuidar de todos nós.">

      <h5>Informações de contato</h5>
      <p>Rua das Palmeiras, 123 – São Paulo, SP</p>
      <p>(11) 99888-4455</p>
